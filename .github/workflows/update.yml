name: Update profile README

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py, ascii_art.txt]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          # Un PAT (secret ACCESS_TOKEN) permet de compter aussi les contributions privées
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python3 generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git pull --rebase
          git push
